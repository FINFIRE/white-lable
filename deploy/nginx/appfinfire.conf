upstream finfire_backend {
    server 127.0.0.1:8000;
    keepalive 32;
}

# 1) HTTP → HTTPS for both apex and any subdomain.
server {
    listen 80;
    listen [::]:80;
    server_name appfinfire.com *.appfinfire.com;

    # Let certbot's webroot challenges still work over HTTP if you ever
    # switch from DNS-01 to HTTP-01 renewals.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 2) HTTPS — same block serves both appfinfire.com and *.appfinfire.com,
#    because the wildcard cert covers both and django-tenants uses the Host
#    header (not the URL path) to pick the tenant.
server {
    # http2 on the listen line is the portable form that works on
    # nginx >= 1.9.5 (Ubuntu 22.04/24.04 ship 1.18 / 1.24). The newer
    # `http2 on;` standalone directive only exists on nginx >= 1.25.1.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name appfinfire.com *.appfinfire.com;

    # Wildcard cert issued by deploy/issue_cert.sh
    ssl_certificate     /etc/letsencrypt/live/appfinfire.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/appfinfire.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Large enough for file uploads (signed PDFs, logos, etc.)
    client_max_body_size 25M;

    # Where the built React SPA lives. deploy.sh rsyncs
    # finfire_frontend/dist/ here.
    root /var/www/finfire/dist;
    index index.html;

    # Django collectstatic output (admin CSS/JS, DRF browsable API assets).
    # Path matches STATIC_ROOT in production.py and the bind mount in
    # docker-compose.prod.yml.
    location /static/ {
        alias /var/www/finfire/static/;
        access_log off;
        expires 30d;
    }

    # User-uploaded media (tenant logos, signatures, etc.).
    location /media/ {
        alias /var/www/finfire/media/;
        access_log off;
        expires 7d;
    }

    # Everything API-shaped goes to gunicorn. The Host header is preserved
    # so django-tenants can resolve the tenant from the subdomain.
    location ~ ^/(api|auth|admin)/ {
        proxy_pass http://finfire_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_redirect off;
        proxy_read_timeout 60s;
    }

    # SPA fallback — anything that wasn't a real file goes to index.html
    # so client-side routing works on direct loads/refreshes.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
